<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Learn With Easy</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f4f4f4;
    }
    header {
      background: #4CAF50;
      color: white;
      padding: 15px;
      text-align: center;
    }
    nav {
      background: #333;
      padding: 10px;
      text-align: center;
    }
    nav a {
      color: white;
      margin: 0 15px;
      text-decoration: none;
      cursor: pointer;
    }
    nav a:hover {
      text-decoration: underline;
    }
    section {
      padding: 20px;
      background: white;
      margin: 20px auto;
      width: 80%;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      display: none; /* hidden by default */
    }
    footer {
      background: #333;
      color: white;
      text-align: center;
      padding: 10px;
      position: fixed;
      bottom: 0;
      width: 100%;
    }
    button {
      background: #4CAF50;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background: #45a049;
    }
  </style>
</head>
<body>

  <header>
    <h1>Welcome to Learn With Easy</h1>
    <p>Use the site to learn the things in easy way</p>
  </header>

  <nav>
    <a onclick="showSection('about')">About</a>
    <a onclick="showSection('contact')">Contact</a>
    <a onclick="showSection('login')">Register / Login</a>
  </nav>

  <!-- About Section -->
  <section id="about">
    <h2>About</h2>
    <p>This site is only for who wants to learn things in easy way and real time.</p>
  </section>

  <!-- Contact Section -->
  <section id="contact">
    <h2>Contact</h2>
    <p>Email: learnwitheasyhub@gmail.com</p>
  </section>

  <!-- Register / Login Section -->
  <section id="login">
    <h2>Register / Login</h2>
    <form>
      <label>Email:</label><br>
      <input type="email" name="email" required><br><br>

      <label>Password:</label><br>
      <input type="password" name="password" required><br><br>

      <button type="submit">Sign In</button>
    </form>
  </section>

  <footer>
    <p>&copy; 2026 Learn With Easy</p>
  </footer>

  <script>
    function showSection(sectionId) {
      // Hide all sections
      document.getElementById('about').style.display = 'none';
      document.getElementById('contact').style.display = 'none';
      document.getElementById('login').style.display = 'none';
      // Show the clicked section
      document.getElementById(sectionId).style.display = 'block';
    }

    // Show login by default
    showSection('login');
  </script>

</body>
</html>
